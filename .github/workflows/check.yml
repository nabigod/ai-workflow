name: Check workflow package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check documentation
        run: python scripts/check_docs.py
        env:
          PYTHONUTF8: '1'
      - name: Test deployment and installation
        run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: '1'
